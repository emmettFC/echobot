name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run smoke tests (synthetic data only, no raw files needed)
        run: |
          pytest tests/ -v

      - name: Import package
        run: |
          python -c "import echobot; from echobot import io, echobot_pipeline, ek80_pipeline, snr, compare, linearity, hydrophone, plotting; print(f'echobot {echobot.__version__} imports OK')"
